name: macOS CI

on:
  push:
    branches:
      - "task/**"
      - dev
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain and architecture
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Build unsigned arm64 Debug app
        run: |
          xcodebuild \
            -project LocalLectureSTT.xcodeproj \
            -scheme LocalLectureSTT \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test unsigned arm64 Debug app
        run: |
          xcodebuild \
            -project LocalLectureSTT.xcodeproj \
            -scheme LocalLectureSTT \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build developer benchmark with pinned native bridge
        run: swift build --disable-automatic-resolution
      - name: Check lecture frame boundaries and benchmark aggregation
        run: python3 -B -m unittest discover -s tools/t16
      - name: Verify the product engine in the Release app
        run: |
          xcodebuild -project LocalLectureSTT.xcodeproj -scheme LocalLectureSTT \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/t17-release" CODE_SIGNING_ALLOWED=NO build
          python3 -B tools/verify_product_engine.py "$RUNNER_TEMP/t17-release/Build/Products/Release/LocalLectureSTT.app"
